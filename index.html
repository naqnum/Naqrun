<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NaqRun">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>NaqRun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0E0F11;--surface:#1A1C20;--surface2:#22252A;--text:#F2F2F0;--muted:#A6AAB1;--border:#2B2E34;
  --accent:#FF7A1A;--accent-text:#140A02;--soft:#2A1D12;--soft-text:#FFB27A;
  --g-bg:#15301F;--g:#7FD8A0;--y-bg:#33300F;--y:#F2D46B;--o-bg:#3A2410;--o:#FFB066;--r-bg:#3A1614;--r:#FF948A;
  --head:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-text-size-adjust:100%}
body{min-height:100vh}
main{max-width:560px;margin:0 auto;padding:calc(20px + var(--safe-t)) 16px calc(110px + var(--safe-b));display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-family:var(--head);font-weight:700;font-size:28px;line-height:1.1}
h2{margin:0;font-family:var(--head);font-weight:700;font-size:17px}
p{margin:0}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.soft{background:var(--soft);color:var(--soft-text)}
.chip.vert{background:var(--g-bg);color:var(--g)}.chip.jaune{background:var(--y-bg);color:var(--y)}.chip.orange{background:var(--o-bg);color:var(--o)}.chip.rouge,.chip.stop{background:var(--r-bg);color:var(--r)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.hero{display:flex;align-items:baseline;gap:6px}
.hero b{font-family:var(--head);font-weight:700;font-size:72px;line-height:.9}
.hero span{font-family:var(--head);font-size:20px;color:var(--muted)}
ul.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.steps li{display:flex;gap:12px;align-items:flex-start}
ul.steps i{margin-top:5px;width:10px;height:10px;border-radius:3px;flex:none;background:var(--muted)}
ul.steps i.course{background:var(--accent)}ul.steps i.cote{background:var(--r)}
ul.steps .t{font-size:15px;font-weight:600}ul.steps .d{font-size:13px;color:var(--muted)}
.rep{border-left:2px solid var(--border);padding-left:10px;margin-left:4px;display:flex;flex-direction:column;gap:8px}
button,.btn{font-family:var(--body);font-size:15px;font-weight:600;min-height:48px;border-radius:8px;padding:0 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:transparent;color:var(--text);text-decoration:none}
button.primary{background:var(--accent);color:var(--accent-text);border:none}
button.small{min-height:36px;font-size:13px;padding:0 12px}
button:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>*{flex:1}
.bar{height:8px;border-radius:999px;background:var(--border);overflow:hidden}.bar>div{height:100%;background:var(--accent);border-radius:999px}
label.check{display:flex;gap:10px;align-items:center;min-height:36px;font-size:14px}
label.check input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field .val{color:var(--muted);font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:28px}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat b{display:block;font-family:var(--head);font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.notice{background:var(--soft);color:var(--soft-text);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45}
.notice.err{background:var(--r-bg);color:var(--r)}.notice.ok{background:var(--g-bg);color:var(--g)}
.phases{display:flex;gap:3px}.phases div{height:14px;border-radius:4px;background:var(--border)}.phases div.on{background:var(--accent)}
.plabels{display:flex;gap:3px}.plabels span{font-size:11px;color:var(--muted)}
ol.tl{list-style:none;margin:0;padding:0}
ol.tl li{position:relative;display:flex;gap:12px;padding-bottom:14px}
ol.tl li:not(:last-child)::after{content:"";position:absolute;left:7px;top:20px;bottom:-2px;width:2px;background:var(--border)}
ol.tl .c{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);flex:none;margin-top:2px;background:var(--surface)}
ol.tl .c.done{background:var(--accent)}
ol.tl .w{font-size:13px;font-weight:600;color:var(--soft-text)}
.lv{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.lv:last-child{border-bottom:none}
.lv .n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);flex:none}
.lv.done .n{background:var(--g-bg);color:var(--g)}.lv.cur .n{background:var(--accent);color:var(--accent-text)}
.lv.cur{font-weight:600}
.week{border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.week.cur{border-color:var(--accent)}
.sess{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.log{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--border)}
.log:last-child{border-bottom:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;padding:0 8px var(--safe-b);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;flex-direction:column;gap:2px;border:none;border-radius:0;min-height:62px;padding-top:6px;font-size:12px;font-weight:500;color:var(--muted);background:transparent}
nav.tabs button[aria-current=page]{color:var(--accent);font-weight:700}
nav.tabs button svg{padding:3px 12px;border-radius:999px;box-sizing:content-box}
nav.tabs button[aria-current=page] svg{background:var(--soft)}
.iconbtn{min-height:44px;min-width:44px;padding:0;border:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details summary{cursor:pointer;font-size:14px;font-weight:600;min-height:32px;display:flex;align-items:center}
details.sessd{border-bottom:1px solid var(--border)}details.sessd:last-child{border-bottom:none}
details.sessd summary{list-style:none;padding:8px 0}details.sessd summary::-webkit-details-marker{display:none}
.chev{font-size:22px;color:var(--muted);transition:transform .2s;flex:none}details.sessd[open] .chev{transform:rotate(90deg)}
.sessbody{display:flex;flex-direction:column;gap:10px;padding:4px 0 14px}
/* Petits écrans (iPhone 12 mini : 375 px, iPhone SE : 320 px) */
html,body{overflow-x:hidden}
main,.card,.week,.log{min-width:0;max-width:100%}
.row>*,.btns>*,.hdr>*,.sess>*,.field,.stat{min-width:0}
.sess>span{flex:1;overflow-wrap:anywhere}.sess>button,.sess>.chev{flex:none}
p,span,summary,.notice,label{overflow-wrap:anywhere}
input,select,textarea{max-width:100%;min-width:0;box-sizing:border-box}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:44px;text-align:left}
select{-webkit-appearance:none;appearance:none;min-height:44px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;text-overflow:ellipsis}
.hdr{flex-wrap:wrap}
@media (max-width:400px){
  main{padding-left:12px;padding-right:12px;gap:12px}
  .card{padding:14px}
  h1{font-size:25px}
  .hero b{font-size:60px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .btns.wrap>*{flex:1 1 100%}
  nav.tabs{padding:0 2px var(--safe-b)}
  nav.tabs button{font-size:11px;padding:6px 2px 0;min-width:0}
  nav.tabs button svg{padding:3px 8px}
}
@media (max-width:340px){ .btns>*{flex:1 1 100%} .hero b{font-size:52px} }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Navigation principale"><div class="in">
  <button data-tab="today"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg><span>Aujourd'hui</span></button>
  <button data-tab="journal"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path><path d="M9 8h6"></path></svg><span>Journal</span></button>
  <button data-tab="plan"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M4 11h16"></path><path d="M8 15h2M14 15h2"></path></svg><span>Plan</span></button>
  <button data-tab="proj"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"></path><path d="M14 7h7v7"></path></svg><span>Projection</span></button>
  <button data-tab="course"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-10 4 6 3-4 5 8z"></path><path d="M15 4v6M15 4l4 1.5-4 1.5"></path></svg><span>Course</span></button>
</div></nav>
<script src="engine.js"></script>
<script>
"use strict";
var E = window.Engine;
var KEY = "naqrun.v1";
var DEFAULT = { profile: { startLevel: 8, ladderV: 2, cycleStart: null, switchDate: null, hop: false, heel: false, kine: false, clearedStop: null, gates: {}, intervalsId: "", intervalsKey: "", hoursMax: 10, h0: 4.5, ref: { km: 29.6, dplus: 637, hours: 3.45 }, race: null }, logs: [], sent: {} };
var RACE_EXAMPLE = { name: "Raid de l'Archange", date: "2027-06-17", km: 280, dplus: 3000, stages: 3, autonomy: true, terrain: "roulant", night: false, cutoffH: null, confirmed: false };
var KINDS = { palier: "Footing palier", cadence: "Footing cadence", rando: "Rando-course", footing: "Footing", longue: "Sortie longue", cote: "Montées sur la côte", velo: "Vélo / elliptique", autre: "Autre course" };

function load() {
  try {
    var x = JSON.parse(localStorage.getItem(KEY));
    if (x && x.profile) {
      var p = Object.assign({}, DEFAULT.profile, x.profile);
      p.ref = Object.assign({}, DEFAULT.profile.ref, x.profile.ref || {});
      if (p.ladderV !== 2) { p.startLevel = E.LADDER_V1[p.startLevel] || 8; p.ladderV = 2; } // nouvelle échelle de paliers
      return { profile: p, logs: x.logs || [], sent: x.sent || {} };
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT));
}
var DB = load();
if (!DB.profile.cycleStart) { DB.profile.cycleStart = E.mondayOf(E.todayStr()); }
var saveOk = true;
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); saveOk = true; } catch (e) { saveOk = false; } }
var UI = { tab: (location.hash || "#today").slice(1), draft: null, msg: {}, raceDraft: null };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function today() { return E.todayStr(); }
function S() { return E.computeState(DB.profile, DB.logs, today()); }
function cap(x) { return x.charAt(0).toUpperCase() + x.slice(1); }
function num(x) { return String(x).replace(".", ","); }
function chip(v, prov) {
  var lab = { vert: "Verte", jaune: "Orange pendant", orange: "Orange", rouge: "Rouge", stop: "Arrêt" }[v];
  return '<span class="chip ' + v + '"><span class="dot"></span>' + lab + (prov && v !== "stop" ? " (provisoire)" : "") + "</span>";
}
function hm(min) { min = Math.round(min); if (min < 60) return min + " min"; var h = Math.floor(min / 60), m = min % 60; return h + " h" + (m ? " " + String(m).padStart(2, "0") : ""); }
function hh(hours) { return hm(hours * 60); }
function stepsHtml(blocks) {
  function one(st) {
    var kind = st.k === "marche" ? "Marche" : st.k === "cote" ? "Montée" : st.k === "velo" ? "Vélo" : "Course";
    var zone = st.k === "marche" ? " · FC zone 1" : st.k === "cote" ? " · FC zone 3" : " · FC zone 2";
    return '<li><i class="' + st.k + '" aria-hidden="true"></i><div><div class="t">' + esc(st.label || kind) + '</div><div class="d">' + hm(st.min < 1 ? 0 : st.min) .replace(/^0 min$/, Math.round(st.min * 60) + " s") + zone + "</div></div></li>";
  }
  return '<ul class="steps">' + blocks.map(function (b) {
    if (b.rep) return '<li><div style="flex:1"><div class="t">' + b.rep + ' répétitions</div><ul class="steps rep" style="margin-top:8px">' + b.steps.map(one).join("") + "</ul></div></li>";
    return one(b);
  }).join("") + "</ul>";
}

// ---------- Intervals.icu ----------
function ivAuth() { return "Basic " + btoa("API_KEY:" + DB.profile.intervalsKey.trim()); }
function ivBase() { return "https://intervals.icu/api/v1/athlete/" + encodeURIComponent(DB.profile.intervalsId.trim()); }
function ivReady() { return DB.profile.intervalsId.trim() && DB.profile.intervalsKey.trim(); }
function ivFetch(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: ivAuth(), "Content-Type": "application/json", Accept: "application/json" }, opts.headers || {});
  return fetch(ivBase() + path, opts).then(function (r) {
    if (r.status === 401 || r.status === 403) throw new Error("auth");
    if (!r.ok) throw new Error("http " + r.status);
    return r.status === 204 ? null : r.json();
  }, function () { throw new Error("network"); });
}
function ivError(e) {
  if (e.message === "auth") return "Intervals.icu refuse la connexion : vérifie ton identifiant d'athlète et ta clé API dans les réglages.";
  if (e.message === "network") return "Impossible de joindre Intervals.icu (pas de réseau, ou appel bloqué). Tu peux copier la séance et la coller dans Intervals.";
  return "Intervals.icu a répondu une erreur (" + e.message + ").";
}
var SESSIONS = {};
function sendSession(key) {
  var session = SESSIONS[key], msgKey = "send-" + key;
  if (!ivReady()) { UI.msg[msgKey] = { t: "err", m: "Renseigne d'abord ton compte Intervals.icu dans les réglages (roue crantée sur l'écran Aujourd'hui)." }; render(); return; }
  var ev = E.intervalsEvent(session), id = session.date + "|" + session.title, prev = DB.sent[id];
  UI.msg[msgKey] = { t: "", m: "Envoi en cours…" }; render();
  var post = function () { return ivFetch("/events", { method: "POST", body: JSON.stringify(ev) }); };
  var p = prev ? ivFetch("/events/" + prev, { method: "PUT", body: JSON.stringify(ev) }).catch(function (e) { if (e.message === "http 404") return post(); throw e; }) : post();
  p.then(function (res) {
    if (res && res.id != null) DB.sent[id] = res.id;
    save();
    UI.msg[msgKey] = { t: "ok", m: "Envoyée à Intervals.icu pour " + E.longDate(session.date) + ". Elle arrive sur ta Fenix à la prochaine synchro Garmin Connect (les 7 prochains jours sont transmis)." };
    render();
  }).catch(function (e) { UI.msg[msgKey] = { t: "err", m: ivError(e), copy: true }; render(); });
}
function copySession(key) {
  var session = SESSIONS[key]; if (!session) return;
  var txt = session.title + "\n\n" + E.intervalsText(session.blocks);
  var done = function () { UI.msg["send-" + key] = { t: "ok", m: "Texte copié. Colle-le dans une séance du calendrier Intervals.icu." }; render(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { prompt("Copie ce texte :", txt); }); else prompt("Copie ce texte :", txt);
}
function msgHtml(key) {
  var m = UI.msg["send-" + key]; if (!m) return "";
  return '<div class="notice ' + m.t + '">' + esc(m.m) + "</div>" + (m.copy ? '<button class="small" data-act="copy" data-key="' + key + '">Copier la séance</button>' : "");
}
var WATCH = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="3"></rect><path d="M9 6l1-3h4l1 3M9 18l1 3h4l1-3M12 10v2l1 1"></path></svg>';

// ---------- Cartes ----------
function sessionCard(sess, key, label) {
  SESSIONS[key] = sess;
  var min = E.totalMin(sess.blocks);
  var sub = sess.level ? "Palier " + sess.level + " sur " + E.MAX_LEVEL + " · " + sess.phase + " · la séance qui fait progresser" : (sess.week ? sess.week.block + " · semaine " + sess.week.i + " · " + num(sess.week.hours) + " h prévues" : KINDS[sess.kind] || "");
  return '<section class="card"><div class="row"><h2>' + esc(label) + '</h2><span class="chip soft">' + esc(KINDS[sess.kind] || sess.kind) + "</span></div>" +
    '<div class="hero"><b>' + Math.round(min) + '</b><span>min au total</span></div>' +
    '<p style="font-family:var(--head);font-weight:700;font-size:20px">' + esc(sess.title) + '</p><p class="muted">' + esc(sub) + "</p>" +
    stepsHtml(sess.blocks) + (sess.note ? '<div class="notice">' + esc(sess.note) + "</div>" : "") +
    (sess.kind !== "velo" ? '<p class="muted">Pendant la course : au-delà de 3/10, ralentis ou marche. Au-delà de 5/10, ou si la douleur augmente, arrête et rentre en marchant.</p>' : "") +
    '<button class="primary" data-act="send" data-key="' + key + '">' + WATCH + "Envoyer sur la Fenix 7X</button>" + msgHtml(key) +
    (sess.kind !== "velo" ? '<button data-act="tolog" data-key="' + key + '">J\'ai fait la séance : remplir le journal</button>' : "") + moveHtml(sess, key) + "</section>";
}
function weekList(sessions, prefix) {
  if (!sessions.length) return '<p class="muted">Aucune séance prévue.</p>';
  return sessions.map(function (x, j) {
    var key = prefix + j; SESSIONS[key] = x;
    var open = UI.open === key;
    return '<details class="sessd" data-key="' + key + '"' + (open ? " open" : "") + '><summary class="sess"><span>' + esc(cap(E.longDate(x.date))) + (x.origDate ? " (reportée)" : "") + '<br><span class="muted">' + esc(x.title) + " · " + hm(E.totalMin(x.blocks)) + '</span></span><span class="chev" aria-hidden="true">›</span></summary>' +
      '<div class="sessbody"><span class="chip soft" style="align-self:flex-start">' + esc(KINDS[x.kind] || x.kind) + "</span>" + stepsHtml(x.blocks) + (x.note ? '<div class="notice">' + esc(x.note) + "</div>" : "") +
      '<button class="small primary" data-act="send" data-key="' + key + '">' + WATCH + "Envoyer sur la Fenix</button>" + msgHtml(key) + moveHtml(x, key) + "</div></details>";
  }).join("");
}
function moveHtml(x, key) {
  var t = today(); if (x.date < t) return "";
  return '<div class="btns"><button class="small" data-act="move" data-key="' + key + '" data-days="1">Reporter à demain</button><button class="small" data-act="skip" data-key="' + key + '">Annuler</button></div>' + (x.origDate ? '<button class="small" data-act="unmove" data-key="' + key + '">Remettre au ' + esc(E.longDate(x.origDate)) + "</button>" : "");
}

// ---------- Vues ----------

    '<p class="muted">' + (dyn ? "Dynamique : le footing palier et le footing cadence verts comptent tous les deux, soit jusqu\'à un palier par semaine (+10 % au plus), hors semaine de consolidation. La préparation de course compte dès que la reprise atteint le relief. Les règles douleur ne changent pas : un orange bloque la montée, un rouge fait reculer." : "Prudent : seule la séance palier compte, soit un palier toutes les deux semaines (+10 % au plus). La préparation de course compte après le test de passage.") + "</p></section>";
  h += '<section class="card"><div class="row"><h2>Grandes étapes</h2></div>' +
    '<p>Fin des paliers de reprise : <strong>' + esc((function () { var w = pr.weeks.filter(function (x) { return x.mode === "passage"; })[0]; return w ? cap(E.longDate(w.monday)) : (s.mode === "ultra" ? "faite" : "au-delà de 9 mois"); })()) + "</strong></p>" +
    '<p>Début du programme ultra : <strong>' + esc(pr.switchDate ? cap(E.longDate(pr.switchDate)) : "à définir") + "</strong></p>" +
    (p.race ? '<p>Course : <strong>' + esc(p.race.name) + "</strong>, " + esc(E.longDate(p.race.date)) + "</p>" : '<p class="muted">Ajoute une course dans l\'onglet Course pour voir le programme se projeter.</p>') +
    '<p class="muted">Hypothèse : toutes les séances vertes, au rythme choisi ci-dessus. Chaque séance orange ou rouge décale tout ; la projection se recalcule à chaque saisie.</p></section>';
  var month = "", body = "";
  weeks.forEach(function (w, i) {
    var mth = E.monthYear(w.monday);
    if (mth !== month) { if (body) h += body + "</section>"; month = mth; body = '<section class="card"><h2>' + esc(cap(mth)) + "</h2>"; }
    var lab = w.mode === "programme" ? w.block + (w.choc ? " · choc" : "") + (w.light ? " · allégée" : "") : w.mode === "passage" ? "Test de passage" : "Palier " + Math.min(w.level, E.MAX_LEVEL) + " · " + E.LEVELS[Math.min(w.level, E.MAX_LEVEL) - 1].title + (w.consolidation ? " · consolidation" : "");
    var run = Math.round(w.runMinutes), tot = Math.round(w.minutes);
    body += '<details class="week' + (i === 0 ? " cur" : "") + '"' + (i === 0 ? " open" : "") + '><summary style="display:flex;flex-direction:column;align-items:stretch;gap:6px">' +
      '<span class="row"><span>Sem. du ' + esc(E.longDate(w.monday).replace(/^\S+ /, "")) + '</span><span class="muted">' + hm(tot) + "</span></span>" +
      '<span class="muted" style="font-weight:500">' + esc(lab) + (w.dplus ? " · " + w.dplus + " m D+" : "") + "</span>" +
      '<span class="bar" aria-hidden="true"><span style="display:block;height:100%;width:' + Math.round(tot / maxMin * 100) + '%;background:var(--accent);border-radius:999px"></span></span>' +
      '<span class="muted">Course et rando : ' + hm(run) + " · vélo : " + hm(tot - run) + "</span></summary>" +
      weekList(w.sessions, "p" + i + "s") + "</details>";
  });
  if (body) h += body + "</section>";
  return h;
}

function vSettings() {
  var p = DB.profile, h = "";
  h += '<header class="hdr"><div><p class="muted">NaqRun</p><h1>Réglages</h1></div><button class="small" data-act="tab" data-tab="today">Fermer</button></header>';
  h += '<section class="card"><h2>Intervals.icu</h2><p class="muted">Dans Intervals.icu : Settings › Connections › Garmin Connect, coche « Upload planned workouts ». Identifiant et clé API dans Settings › Developer Settings. Ils restent sur ce téléphone.</p>' +
    '<label class="field">Identifiant d\'athlète<input type="text" id="ivId" value="' + esc(p.intervalsId) + '" placeholder="i123456" autocapitalize="off" autocomplete="off"></label>' +
    '<label class="field">Clé API<input type="password" id="ivKey" value="' + esc(p.intervalsKey) + '" autocomplete="off"></label>' +
    '<button class="small" data-act="ivtest">Enregistrer et tester la connexion</button>' + (UI.msg.iv ? '<div class="notice ' + UI.msg.iv.t + '">' + esc(UI.msg.iv.m) + "</div>" : "") + "</section>";
  h += '<section class="card"><h2>Reprise</h2><label class="field">Palier de départ<select id="startLevel">' + E.LEVELS.map(function (lv) { return '<option value="' + lv.n + '"' + (lv.n === p.startLevel ? " selected" : "") + ">" + lv.n + " · " + esc(lv.title) + "</option>"; }).join("") + "</select></label>" + (p.switchDate ? '<button class="small" data-act="unswitch">Revenir en mode reprise</button>' : "") + "</section>";
  h += '<section class="card"><h2>Programme</h2><label class="field">Heures maximum par semaine<input type="number" id="hoursMax" min="5" max="16" step="0.5" value="' + p.hoursMax + '"></label>' +
    '<p class="muted">Course de référence pour estimer les durées (par défaut ton trail de Fermanville sur Strava).</p><div class="btns"><label class="field">km<input type="number" inputmode="decimal" id="refKm" value="' + p.ref.km + '"></label><label class="field">D+ (m)<input type="number" inputmode="numeric" id="refDp" value="' + p.ref.dplus + '"></label><label class="field">Durée (h)<input type="number" inputmode="decimal" step="0.05" id="refH" value="' + p.ref.hours + '"></label></div></section>';
  h += '<section class="card"><h2>Sauvegarde</h2><p class="muted">Tes données sont sur ce téléphone. Copie la sauvegarde de temps en temps (dans Notes, par exemple).</p><div class="btns"><button class="small" data-act="export">Copier la sauvegarde</button><button class="small" data-act="import">Coller une sauvegarde</button></div>' + (UI.msg.bk ? '<div class="notice ' + UI.msg.bk.t + '">' + esc(UI.msg.bk.m) + "</div>" : "") + (UI.showImport ? '<textarea id="bkText" placeholder="Colle ta sauvegarde ici"></textarea><button class="small" data-act="doimport">Importer</button>' : "") + "</section>";
  h += '<section class="card"><p class="muted">NaqRun ne remplace pas un avis médical. Si ton kiné t\'a donné d\'autres consignes, elles priment.</p></section>';
  return h;
}

// ---------- Rendu et événements ----------
function render() {
  SESSIONS = {};
  var v = { today: vToday, journal: vJournal, plan: vPlan, proj: vProj, course: vCourse, settings: vSettings }[UI.tab] || vToday;
  document.getElementById("app").innerHTML = v();
  document.querySelectorAll("nav.tabs button").forEach(function (b) { if (b.dataset.tab === UI.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
}
function go(tab) { UI.tab = tab; try { history.replaceState(null, "", "#" + tab); } catch (e) {} render(); window.scrollTo(0, 0); }
function readDraft() {
  var d = UI.draft; if (!d) return;
  var el = function (id) { return document.getElementById(id); };
  if (el("dDate")) d.date = el("dDate").value;
  if (el("dTitle")) d.title = el("dTitle").value;
  if (el("dNote")) d.note = el("dNote").value;
  if (el("dKind")) d.kind = el("dKind").value;
}
function readRace() {
  var r = UI.raceDraft; if (!r) return;
  document.querySelectorAll("[data-race]").forEach(function (el) {
    var k = el.dataset.race;
    if (el.type === "checkbox") r[k] = el.checked;
    else if (el.type === "number") r[k] = el.value === "" ? (k === "cutoffH" ? null : 0) : +el.value;
    else r[k] = el.value;
  });
}

document.addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act],[data-tab]"); if (!b) return;
  if (b.closest("nav.tabs")) { go(b.dataset.tab); return; }
  var a = b.dataset.act, t = today(), p = DB.profile;
  if (a === "tab") return go(b.dataset.tab);
  if (a === "settings") return go("settings");
  if (a === "welcome") { p._welcomed = true; save(); return render(); }
  if (a === "send") return sendSession(b.dataset.key);
  if (a === "copy") return copySession(b.dataset.key);
  if (a === "tolog") { var x = SESSIONS[b.dataset.key]; UI.draft = null; go("journal"); if (x && UI.draft) { UI.draft.kind = x.kind; UI.draft.title = x.title; UI.draft.date = x.date <= t ? x.date : t; render(); } return; }
  if (a === "clearstop") { p.clearedStop = t; save(); return render(); }
  if (a === "morning") { var l = DB.logs.find(function (x) { return x.id === b.dataset.id; }); if (l) { l.morning = +document.getElementById("morningQuick").value; save(); } return render(); }
  if (a === "addmorning") { var l2 = DB.logs.find(function (x) { return x.id === b.dataset.id; }); var val = prompt("Douleur au tibia au réveil, de 0 à 10 :", "0"); if (l2 && val != null && val !== "" && !isNaN(+val)) { l2.morning = Math.max(0, Math.min(10, Math.round(+val))); save(); } return render(); }
  if (a === "dellog") { if (confirm("Supprimer cette séance du journal ?")) { DB.logs = DB.logs.filter(function (x) { return x.id !== b.dataset.id; }); save(); } return render(); }
  if (a === "savelog") {
    readDraft(); var d = UI.draft;
    if (!d.date || d.date > t) { alert("Choisis une date passée ou aujourd'hui."); return; }
    DB.logs.push(Object.assign({}, d, { id: String(Date.now()), title: d.title || KINDS[d.kind] })); save(); UI.draft = null; UI.msg.act = null;
    return go("today");
  }
  if (a === "fetchact") {
    readDraft(); var dd = UI.draft.date; UI.msg.act = { t: "", m: "Recherche de la sortie…" }; render();
    ivFetch("/activities?oldest=" + dd + "&newest=" + dd).then(function (list) {
      var runs = (list || []).filter(function (x) { return /Run|Hike|Walk/.test(x.type || ""); });
      if (!runs.length) { UI.msg.act = { t: "err", m: "Aucune sortie trouvée ce jour-là dans Intervals.icu (la synchro Garmin peut prendre quelques minutes)." }; return render(); }
      var r = runs[0], sec = r.moving_time || r.elapsed_time || 0, cad = r.average_cadence ? Math.round(r.average_cadence < 120 ? r.average_cadence * 2 : r.average_cadence) : null;
      UI.draft.activity = { km: ((r.distance || 0) / 1000).toFixed(2).replace(".", ","), time: Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"), hr: r.average_heartrate ? Math.round(r.average_heartrate) : null, cad: cad, name: r.name || "" };
      UI.msg.act = { t: "ok", m: "Sortie récupérée : " + (r.name || "course") + "." }; render();
    }).catch(function (e) { UI.msg.act = { t: "err", m: ivError(e) }; render(); });
    return;
  }
  if (a === "move" || a === "skip" || a === "unmove") {
    var sx = SESSIONS[b.dataset.key]; if (!sx) return;
    p.moves = p.moves || {};
    var k = (sx.origDate || sx.date) + "|" + sx.kind;
    if (a === "move") {
      var nd = E.addDays(sx.date, +b.dataset.days || 1);
      var runs = function (d) { return E.sessionsOn(p, S(), d, p.race).filter(function (y) { return y.kind !== "velo" && !(y.date === sx.date && y.kind === sx.kind); }).length; };
      if (sx.kind !== "velo" && (runs(nd) || runs(E.addDays(nd, -1)) || runs(E.addDays(nd, 1))) && !confirm("Une autre course est prévue la veille, le jour même ou le lendemain. Pour le tibia, mieux vaut un jour sans course entre deux sorties. Reporter quand même ?")) return;
      p.moves[k] = nd;
    } else if (a === "skip") {
      if (!confirm("Annuler cette séance ? Elle ne sera pas rattrapée : la progression attend simplement la prochaine séance.")) return;
      p.moves[k] = "skip";
    } else delete p.moves[k];
    save(); return render();
  }
  if (a === "rythme") { p.rythme = b.dataset.v; save(); return render(); }
  if (a === "switch") { if (confirm("Passer au programme ultra à partir d'aujourd'hui ?")) { p.switchDate = t; save(); } return render(); }
  if (a === "unswitch") { if (confirm("Revenir en mode reprise ?")) { p.switchDate = null; save(); } return render(); }
  if (a === "saverace") {
    readRace(); var r = UI.raceDraft;
    if (!r.date || !(r.km > 0) || r.dplus < 0) { UI.msg.race = { t: "err", m: "Renseigne au moins la date, la distance et le D+." }; return render(); }
    if (r.date <= t) { UI.msg.race = { t: "err", m: "La date de la course doit être dans le futur." }; return render(); }
    r.stages = Math.max(1, Math.round(r.stages || 1));
    p.race = Object.assign({}, r); save(); UI.msg.race = { t: "ok", m: "Course enregistrée." }; return render();
  }
  if (a === "delrace") { if (confirm("Retirer cette course ?")) { p.race = null; UI.raceDraft = null; save(); } return render(); }
  if (a === "ivtest") {
    p.intervalsId = document.getElementById("ivId").value.trim(); p.intervalsKey = document.getElementById("ivKey").value.trim(); save();
    if (!ivReady()) { UI.msg.iv = { t: "err", m: "Renseigne les deux champs." }; return render(); }
    UI.msg.iv = { t: "", m: "Test en cours…" }; render();
    ivFetch("").then(function (ath) { UI.msg.iv = { t: "ok", m: "Connecté à Intervals.icu" + (ath && ath.name ? " : " + ath.name : "") + "." }; render(); }).catch(function (e) { UI.msg.iv = { t: "err", m: ivError(e) }; render(); });
    return;
  }
  if (a === "export") {
    var txt = JSON.stringify(Object.assign({}, DB, { profile: Object.assign({}, p, { intervalsKey: "" }) }));
    var ok = function () { UI.msg.bk = { t: "ok", m: "Sauvegarde copiée (sans ta clé API)." }; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, function () { prompt("Copie ce texte :", txt); }); else prompt("Copie ce texte :", txt);
    return;
  }
  if (a === "import") { UI.showImport = true; return render(); }
  if (a === "doimport") {
    try { var x2 = JSON.parse(document.getElementById("bkText").value); if (!x2.profile || !Array.isArray(x2.logs)) throw 0; var key = p.intervalsKey; DB = { profile: Object.assign({}, DEFAULT.profile, x2.profile), logs: x2.logs, sent: x2.sent || {} }; DB.profile.ref = Object.assign({}, DEFAULT.profile.ref, x2.profile.ref || {}); if (!DB.profile.intervalsKey) DB.profile.intervalsKey = key; save(); UI.showImport = false; UI.msg.bk = { t: "ok", m: "Sauvegarde importée." }; }
    catch (e) { UI.msg.bk = { t: "err", m: "Ce texte n'est pas une sauvegarde NaqRun valide." }; }
    return render();
  }
});

document.addEventListener("toggle", function (ev) { var d = ev.target; if (d.classList && d.classList.contains("sessd")) { if (d.open) UI.open = d.dataset.key; else if (UI.open === d.dataset.key) UI.open = null; } }, true);
document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (t.id === "morningQuick") { document.getElementById("mv").textContent = t.value + "/10"; return; }
  if (t.dataset.pain && UI.draft) { UI.draft[t.dataset.pain] = +t.value; document.getElementById("o-" + t.dataset.pain).textContent = t.value + "/10"; refreshVerdict(); }
});
document.addEventListener("change", function (ev) {
  var t = ev.target, p = DB.profile;
  if (t.id === "mLater") { readDraft(); UI.draft.morning = t.checked ? null : 0; return render(); }
  if (t.id === "dInc") { UI.draft.increasing = t.checked; return refreshVerdict(); }
  if (t.id === "dKind") { readDraft(); return refreshVerdict(); }
  if (t.dataset.flag != null && UI.draft) { UI.draft.flags[+t.dataset.flag] = t.checked; return refreshVerdict(); }
  if (t.dataset.pass) { p[t.dataset.pass] = t.checked; save(); return render(); }
  if (t.dataset.gate) { p.gates[t.dataset.gate] = t.checked; save(); return render(); }
  if (t.dataset.race) { readRace(); var s2 = S(), box = document.getElementById("raceAnalysis"); if (box) box.innerHTML = raceAnalysis(UI.raceDraft, s2, E.prepStart(DB.profile, s2, today())); return; }
  if (t.id === "startLevel") { p.startLevel = +t.value; save(); return; }
  if (t.id === "hoursMax") { p.hoursMax = Math.max(5, Math.min(16, +t.value || 10)); save(); return; }
  if (t.id === "refKm" || t.id === "refDp" || t.id === "refH") { var k = { refKm: "km", refDp: "dplus", refH: "hours" }[t.id]; if (+t.value > 0) { p.ref[k] = +t.value; save(); } return; }
  if (t.id === "dDate" || t.id === "dTitle" || t.id === "dNote") { readDraft(); return; }
});
function refreshVerdict() { readDraft(); var b = document.getElementById("verdictBox"); if (b && UI.draft) b.innerHTML = verdictHtml(UI.draft); }

window.addEventListener("hashchange", function () { var h = location.hash.slice(1); if (h && h !== UI.tab) { UI.tab = h; render(); } });
render();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (reg) { reg.update(); }).catch(function () {});
  // nouvelle version installée : recharger une fois pour l'afficher
  var reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () { if (!reloaded) { reloaded = true; location.reload(); } });
}
</script>
</body>
</html>
