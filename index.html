<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NaqRun">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>NaqRun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0E0F11;--surface:#1A1C20;--surface2:#22252A;--text:#F2F2F0;--muted:#A6AAB1;--border:#2B2E34;
  --accent:#FF7A1A;--accent-dim:#8A4A1E;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--accent-text:#140A02;--soft:#2A1D12;--soft-text:#FFB27A;
  --g-bg:#15301F;--g:#7FD8A0;--y-bg:#33300F;--y:#F2D46B;--o-bg:#3A2410;--o:#FFB066;--r-bg:#3A1614;--r:#FF948A;
  --head:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-text-size-adjust:100%}
body{min-height:100vh}
main{max-width:560px;margin:0 auto;padding:calc(20px + var(--safe-t)) 16px calc(110px + var(--safe-b));display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-family:var(--head);font-weight:700;font-size:28px;line-height:1.1}
h2{margin:0;font-family:var(--head);font-weight:700;font-size:17px}
p{margin:0}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.soft{background:var(--soft);color:var(--soft-text)}
.zchip{display:inline-block;border:1px solid;border-radius:999px;padding:0 7px;font-size:11px;font-weight:600;line-height:18px;white-space:nowrap}
.chip.vert{background:var(--g-bg);color:var(--g)}.chip.jaune{background:var(--y-bg);color:var(--y)}.chip.orange{background:var(--o-bg);color:var(--o)}.chip.rouge,.chip.stop{background:var(--r-bg);color:var(--r)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.ttl{font-family:var(--head);font-weight:700;font-size:22px;line-height:1.2}
h3{margin:0;font-family:var(--head);font-weight:700;font-size:15px}
.grp{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border);padding-top:14px}
.row>h2{flex:none}
.chart svg{width:100%;height:auto;display:block}
.chart [data-tip]{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--border)}.tbl th{color:var(--muted);font-weight:500}.tbl tr:last-child td{border-bottom:none}
.readout{min-height:20px}
.tipbox{position:fixed;z-index:30;display:none;pointer-events:none;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.35;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
input[type=range].pain{-webkit-appearance:none;appearance:none;height:16px;border-radius:999px;margin:8px 0;background:linear-gradient(90deg,#3FBF6F 0%,#C9D94A 40%,#FFC247 60%,#FF7A1A 80%,#E5483D 100%);outline-offset:6px}
input[type=range].pain::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--c,#3FBF6F);border:4px solid #F2F2F0;box-shadow:0 1px 5px rgba(0,0,0,.6)}
input[type=range].pain::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--c,#3FBF6F);border:4px solid #F2F2F0;box-shadow:0 1px 5px rgba(0,0,0,.6)}
.pv{font-weight:500}.pv b{font-weight:700}
button.opt{flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:56px;padding:8px 14px;width:100%}
button.opt span{font-size:12px;font-weight:400;color:var(--muted)}
.sessd{border-left:4px solid var(--kc,var(--border));padding-left:12px;margin-left:0;background:linear-gradient(90deg,color-mix(in srgb,var(--kc,transparent) 10%,transparent),transparent 60%);border-radius:0 8px 8px 0}
.dayblock{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h span{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase}
.calTitle{text-align:center;font-size:21px}.avatar{width:52px;height:52px;border-radius:50%;background:var(--soft);color:var(--soft-text);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:22px;flex:none}.mth{margin-top:16px;display:flex;flex-direction:column;gap:10px}.mth:first-child{margin-top:12px}
.day{flex-direction:column;justify-content:flex-start;align-items:center;gap:4px;min-height:66px;padding:8px 2px;border-radius:8px;border:1px solid transparent;background:var(--surface2);font-weight:500;min-width:0;overflow:hidden}
.day b{font-size:16px;font-weight:700}.day.out{opacity:.35}.day.today{border-color:var(--accent)}.day.sel{background:var(--soft)}
.day .dots{display:flex;gap:3px;min-height:8px}.day .dots i{width:10px;height:10px;border-radius:50%;box-sizing:border-box;border:2px solid currentColor;background:transparent}
.day .dots i.done{background:currentColor}.day .ct{display:none}
.day.rest b{color:var(--g)}.day.rest{background:color-mix(in srgb,var(--g) 8%,var(--surface2))}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:32px;font-size:14px}
.kv>span:first-child{color:var(--muted)}.kv>b{font-weight:600;text-align:right}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
.seg button{flex:1;min-width:0;min-height:44px;border:none;border-radius:8px;font-size:13px;padding:0 4px;color:var(--muted);background:transparent}
.seg button[aria-pressed=true]{background:var(--soft);color:var(--soft-text);font-weight:700}
details.more>summary{list-style:none;color:var(--muted);font-weight:500;font-size:13px}details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"›";margin-right:6px;display:inline-block;transition:transform .2s}details.more[open]>summary::before{transform:rotate(90deg)}
ul.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.steps li{display:flex;gap:12px;align-items:flex-start}
ul.steps i{margin-top:5px;width:10px;height:10px;border-radius:3px;flex:none;background:var(--muted)}
ul.steps i.course{background:var(--accent)}ul.steps i.cote{background:var(--r)}
ul.steps .t{font-size:15px;font-weight:600}ul.steps .d{font-size:13px;color:var(--muted)}
.rep{border-left:2px solid var(--border);padding-left:10px;margin-left:4px;display:flex;flex-direction:column;gap:8px}
button,.btn{font-family:var(--body);font-size:15px;font-weight:600;min-height:48px;border-radius:8px;padding:0 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:transparent;color:var(--text);text-decoration:none}
button.primary{background:var(--accent);color:var(--accent-text);border:none}
button.small{min-height:44px;font-size:14px;padding:0 12px}
button:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>*{flex:1}
.bar{height:8px;border-radius:999px;background:var(--border);overflow:hidden}.bar>div{height:100%;background:var(--accent);border-radius:999px}
label.check{display:flex;gap:10px;align-items:center;min-height:36px;font-size:14px}
label.check input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field .val{color:var(--muted);font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:28px}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat b{display:block;font-family:var(--head);font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.notice{background:var(--soft);color:var(--soft-text);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45}
.notice.err{background:var(--r-bg);color:var(--r)}.notice.ok{background:var(--g-bg);color:var(--g)}
.phases{display:flex;gap:3px}.phases div{height:14px;border-radius:4px;background:var(--border)}.phases div.on{background:var(--accent)}
.plabels{display:flex;gap:3px}.plabels span{font-size:11px;color:var(--muted)}
ol.tl{list-style:none;margin:0;padding:0}
ol.tl li{position:relative;display:flex;gap:12px;padding-bottom:14px}
ol.tl li:not(:last-child)::after{content:"";position:absolute;left:7px;top:20px;bottom:-2px;width:2px;background:var(--border)}
ol.tl .c{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);flex:none;margin-top:2px;background:var(--surface)}
ol.tl .c.done{background:var(--accent)}
ol.tl .w{font-size:13px;font-weight:600;color:var(--soft-text)}
.lv{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.lv:last-child{border-bottom:none}
.lv .n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);flex:none}
.lv.done .n{background:var(--g-bg);color:var(--g)}.lv.cur .n{background:var(--accent);color:var(--accent-text)}
.lv.cur{font-weight:600}
.week{border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.week.cur{border-color:var(--accent)}
.sess{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.log{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--border)}
.log:last-child{border-bottom:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;padding:0 8px var(--safe-b);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;flex-direction:column;gap:2px;border:none;border-radius:0;min-height:62px;padding-top:6px;font-size:12px;font-weight:500;color:var(--muted);background:transparent}
nav.tabs button[aria-current=page]{color:var(--accent);font-weight:700}
nav.tabs button svg{padding:3px 12px;border-radius:999px;box-sizing:content-box}
nav.tabs button[aria-current=page] svg{background:var(--soft)}
.iconbtn{min-height:44px;min-width:44px;padding:0;border:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details summary{cursor:pointer;font-size:14px;font-weight:600;min-height:32px;display:flex;align-items:center}
details.sessd{border-bottom:1px solid var(--border)}details.sessd:last-child{border-bottom:none}
details.sessd summary{list-style:none;padding:8px 0}details.sessd summary::-webkit-details-marker{display:none}
.chev{font-size:22px;color:var(--muted);transition:transform .2s;flex:none}details.sessd[open] .chev{transform:rotate(90deg)}
.sessbody{display:flex;flex-direction:column;gap:10px;padding:4px 0 14px}
/* Petits écrans (iPhone 12 mini : 375 px, iPhone SE : 320 px) */
html,body{overflow-x:hidden}
main,.card,.week,.log{min-width:0;max-width:100%}
.row>*,.btns>*,.hdr>*,.sess>*,.field,.stat{min-width:0}
.sess>span{flex:1;overflow-wrap:anywhere}.sess>button,.sess>.chev{flex:none}
p,span,summary,.notice,label{overflow-wrap:anywhere}
input,select,textarea{max-width:100%;min-width:0;box-sizing:border-box}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:44px;text-align:left}
select{-webkit-appearance:none;appearance:none;min-height:44px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;text-overflow:ellipsis}
.hdr{flex-wrap:wrap}
@media (max-width:400px){
  main{padding-left:12px;padding-right:12px;gap:12px}
  .card{padding:14px}
  h1{font-size:25px}
  .seg button{font-size:12px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .btns.wrap>*{flex:1 1 100%}
  nav.tabs{padding:0 2px var(--safe-b)}
  nav.tabs button{font-size:11px;padding:6px 2px 0;min-width:0}
  nav.tabs button svg{padding:3px 8px}
}
.calwrap{display:flex;flex-direction:column;gap:14px}.calmain,.calside{display:flex;flex-direction:column;gap:14px;min-width:0}
/* Ordinateur : menu à gauche, toute la largeur, calendrier au centre */
@media (min-width:900px){
  body{padding-left:220px}
  main{max-width:none;padding:32px 40px 48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));align-items:start;gap:16px}
  main>.hdr,main>.seg,main>.notice,main>.calwrap,main>.full,main>details,main>.card.full{grid-column:1/-1}
  main>.seg{max-width:560px}
  main[data-view$=finish]{grid-template-columns:minmax(0,760px);justify-content:center}
  .calwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
  .calTitle{font-size:26px}
  .day{min-height:112px}
  nav.tabs{top:0;right:auto;width:220px;flex-direction:column;align-items:stretch;border-top:none;border-right:1px solid var(--border);justify-content:flex-start;padding:24px 12px}
  nav.tabs::before{content:"NaqRun";font-family:var(--head);font-weight:700;font-size:22px;padding:0 14px 18px;display:block}
  nav.tabs .in{flex-direction:column;max-width:none;gap:4px}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:0 14px;font-size:15px;border-radius:10px}
  nav.tabs button svg{padding:0;border-radius:0}
  nav.tabs button[aria-current=page]{background:var(--soft)}nav.tabs button[aria-current=page] svg{background:none}
  .day{align-items:stretch;text-align:left;padding:10px}
  .day .ct{display:block;font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
}
@media (max-width:340px){ .btns>*{flex:1 1 100%} }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Navigation principale"><div class="in">
  <button data-tab="today"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg><span>Aujourd'hui</span></button>
  <button data-tab="plan"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M4 11h16"></path><path d="M8 15h2M14 15h2"></path></svg><span>Plan</span></button>
  <button data-tab="journal"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path><path d="M9 8h6"></path></svg><span>Journal</span></button>
  <button data-tab="data"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"></path></svg><span>Données</span></button>
  <button data-tab="settings"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg><span>Profil</span></button>
</div></nav>
<script src="engine.js"></script>
<script>
"use strict";
var E = window.Engine;
var KEY = "naqrun.v1";
var DEFAULT = { profile: { startLevel: 5, ladderV: 3, cycleStart: null, switchDate: null, hop: false, heel: false, kine: false, clearedStop: null, gates: {}, intervalsId: "", intervalsKey: "", hoursMax: 10, h0: 4.5, zones: [[129, 153], [153, 166], [166, 173], [173, 180], [180, 192]], ref: { km: 29.6, dplus: 637, hours: 3.45 }, race: null }, logs: [], sent: {} };
var RACE_EXAMPLE = { name: "Raid de l'Archange", date: "2027-06-17", km: 280, dplus: 3000, stages: 3, autonomy: true, terrain: "roulant", night: false, cutoffH: null, confirmed: false };
var KINDS = { palier: "Footing progression", cadence: "Footing cadence", footing: "Footing facile", vallon: "Vallon", rando: "Rando-course", longue: "Sortie longue", cote: "Côtes marchées", velo: "Vélo / elliptique", autre: "Autre course" };

function load() {
  try {
    var x = JSON.parse(localStorage.getItem(KEY));
    if (x && x.profile) {
      var p = Object.assign({}, DEFAULT.profile, x.profile);
      p.ref = Object.assign({}, DEFAULT.profile.ref, x.profile.ref || {});
      if (!p.zones) p.zones = DEFAULT.profile.zones.map(function (z) { return z.slice(); });
      if (p.ladderV !== 3) { p.startLevel = 5; p.ladderV = 3; } // échelle v3 : départ à 2 × 14 min (niveau actuel de Nour)
      return { profile: p, logs: x.logs || [], sent: x.sent || {} };
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT));
}
var DB = load();
if (!DB.profile.cycleStart) { DB.profile.cycleStart = E.mondayOf(E.todayStr()); }
var saveOk = true;
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); saveOk = true; } catch (e) { saveOk = false; } }
var UI = { tab: (location.hash || "#today").slice(1), sub: { plan: "cal", journal: "new", me: "profile", today: "seance" }, draft: null, msg: {}, raceDraft: null };
var ALIAS = { course: ["plan", "course"], proj: ["plan", "cal"] };
if (ALIAS[UI.tab]) { UI.sub.plan = ALIAS[UI.tab][1]; UI.tab = "plan"; }
function hdr(kicker, title, right) { return '<header class="hdr"><div><p class="muted">' + kicker + "</p><h1>" + title + "</h1></div>" + (right || "") + "</header>"; }
function seg(group, items, cur, act) { return '<div class="seg" role="group">' + items.map(function (it) { return '<button data-act="' + (act || "seg") + '" data-g="' + group + '" data-v="' + it[0] + '" aria-pressed="' + (cur === it[0]) + '">' + it[1] + "</button>"; }).join("") + "</div>"; }
var PSTOPS = [[0, [63, 191, 111]], [4, [201, 217, 74]], [6, [255, 194, 71]], [8, [255, 122, 26]], [10, [229, 72, 61]]];
function painColor(v) {
  for (var i = 1; i < PSTOPS.length; i++) if (v <= PSTOPS[i][0]) {
    var a = PSTOPS[i - 1], b = PSTOPS[i], f = (v - a[0]) / (b[0] - a[0]);
    return "rgb(" + a[1].map(function (c, k) { return Math.round(c + (b[1][k] - c) * f); }).join(",") + ")";
  }
  return "rgb(229,72,61)";
}
function painWord(v, kind) {
  if (kind === "rpe") return v <= 1 ? "Très facile" : v <= 4 ? "Facile" : v <= 5 ? "Modéré" : v <= 7 ? "Dur" : "Très dur";
  return v <= 0 ? "Aucune" : v <= 3 ? "Faible" : v <= 5 ? "Modérée" : v <= 7 ? "Forte" : "Très forte";
}
function painVal(id, v, kind) { return '<span class="pv" id="' + id + '" style="color:' + painColor(v) + '"><b>' + v + "/10</b> " + painWord(v, kind) + "</span>"; }

  cur.forEach(function (x) { if (x.date <= sun) add(x.date, x); });
  s.logs.forEach(function (l) {
    var hit = (map[l.date] || []).filter(function (x) { return x.done && !x.past && x.kind === l.kind; })[0];
    if (hit) { hit.v = l._v; hit.prov = l._provisional; } else add(l.date, { past: true, kind: l.kind, title: l.title || KINDS[l.kind] || "Course", v: l._v, prov: l._provisional, date: l.date });

}
function vCalendar() {

  h += '<div class="cal cal-h">' + ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"].map(function (d) { return "<span>" + d + "</span>"; }).join("") + "</div><div class=\"cal\">";

    var dots = list.slice(0, 3).map(function (x) { return '<i style="color:' + ((x.past || x.done) && VCOL[x.v] ? VCOL[x.v] : x.past ? "var(--muted)" : KCOL[x.kind] || "var(--accent)") + '"' + (x.done || x.past ? ' class="done"' : "") + "></i>"; }).join("");
    var tt = list.filter(function (x) { return !x.past; }).slice(0, 2).map(function (x) { return '<span class="ct">' + esc(x.title.replace(/ · .*/, "")) + "</span>"; }).join("");

  var dl = (map[sel] || []);

  if (!dl.length) h += '<p class="muted">Rien de prévu ce jour-là : repos.</p>';
  return h + "</section>" + projHead() + "</aside></div>" + projWeeks();
}

// ---------- Rendu et événements ----------

}
function go(tab) { if (tab === "today" && UI.tab !== "today") UI.sub.today = "seance"; if (tab === "settings" && UI.tab !== "settings") UI.sub.me = "profile"; UI.flash = null; UI.cant = null; if (tab !== "today") UI.finish = false; if (ALIAS[tab]) { UI.sub.plan = ALIAS[tab][1]; tab = "plan"; } UI.tab = tab; try { history.replaceState(null, "", "#" + tab); } catch (e) {} render(); window.scrollTo(0, 0); }

}

function hideTip() { if (TIP) TIP.style.display = "none"; }
document.addEventListener("mouseover", function (ev) { var el = ev.target.closest && ev.target.closest(".chart [data-tip]"); if (el) showTip(el, ev.clientX, ev.clientY); });
document.addEventListener("mousemove", function (ev) { var el = ev.target.closest && ev.target.closest(".chart [data-tip]"); if (el) showTip(el, ev.clientX, ev.clientY); else hideTip(); });

    } else { p.moves[ck] = "skip"; UI.flash = { t: "ok", m: "Séance annulée. La progression attend simplement la prochaine séance." }; }

  }

  if (a === "savelog") {

    DB.logs.push(Object.assign({}, effDraft(d), { id: String(Date.now()), title: d.title || KINDS[d.kind], hrTrusted: !!p.hrTrusted })); save(); UI.draft = null; UI.finish = false; UI.msg.act = null;

  }

  if (a === "move" || a === "skip" || a === "unmove") {

  }
  if (a === "delrace") { if (confirm("Retirer cette course ?")) { p.race = null; UI.raceDraft = null; save(); } return render(); }

});

document.addEventListener("toggle", function (ev) { var d = ev.target; if (d.classList && d.classList.contains("sessd")) { if (d.open) UI.open = d.dataset.key; else if (UI.open === d.dataset.key) UI.open = null; } }, true);
